  if(data.groups&&typeof data.groups==='object')groups={...groups,...Object.fromEntries(Object.entries(data.groups).map(([id,g])=>[id,Array.isArray(g)?g:[g.label||id,g.color||'#40536a']]))};
  [...new Set(data.nodes.map(n=>n.group||'source'))].forEach((id,i)=>{if(!groups[id])groups[id]=[id.replace(/^(package|folder)-/,'').replace(/[-_]/g,' '),GROUP_PALETTE[i%GROUP_PALETTE.length]]});
  nodes=data.nodes.map((n,i)=>({...n,label:n.label||n.id,group:n.group||'source',type:n.type||'component',description:n.description||'',source:n.source||'',x:Number.isFinite(n.x)?n.x:120+(i%5)*220,y:Number.isFinite(n.y)?n.y:100+Math.floor(i/5)*110}));
  edges=data.edges.map((e,i)=>({...e,id:e.id||`e${i+1}`,label:e.label||''}));
  flows=(Array.isArray(data.flows)?data.flows:[]).map((f,i)=>({...f,id:f.id||`flow-${i+1}`,name:f.name||f.id||`Flow ${i+1}`,description:f.description||'',steps:Array.isArray(f.steps)?f.steps:[],edgeIds:Array.isArray(f.edgeIds)?f.edgeIds:[]}));
  let repo=data.repository||{},stack=Array.isArray(repo.primaryStack)?repo.primaryStack.join(' · '):'';
  document.getElementById('projectTitle').textContent=repo.name||'Architecture Viewer';document.title=(repo.name||'Architecture')+' — Architecture';document.getElementById('projectMeta').textContent=stack||repo.purpose||'';document.getElementById('generatedTag').textContent='ARCHITECTURE · '+String(data.generatedAt||'custom').slice(0,10);
  G.setAttribute('viewBox','0 0 1200 760');render();reset();D.innerHTML='<div class="eyebrow">JSON loaded</div><h3>'+escapeHtml(repo.name||'Architecture')+'</h3><p>'+escapeHtml(repo.purpose||'コンポーネントを選択すると詳細を表示します。')+'</p><div class="hint">JSONをドロップして切り替えることもできます。</div>';
}
async function openFile(file){try{loadArchitecture(JSON.parse(await file.text()))}catch(error){alert('JSONを読み込めませんでした: '+error.message)}}
document.getElementById('fileInput').onchange=e=>{let file=e.target.files[0];if(file)openFile(file);e.target.value=''};
document.getElementById('download').onclick=()=>{let blob=new Blob([JSON.stringify(currentData(),null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeFilename((architectureData?.repository?.name||'architecture')+'.json');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)};
function safeFilename(name){return name.replace(/[^a-zA-Z0-9._-]+/g,'_')}
document.addEventListener('dragover',e=>{if([...e.dataTransfer.items].some(i=>i.kind==='file'))e.preventDefault()});document.addEventListener('drop',e=>{let file=[...e.dataTransfer.files].find(f=>f.name.toLowerCase().endsWith('.json'));if(file){e.preventDefault();openFile(file)}});
